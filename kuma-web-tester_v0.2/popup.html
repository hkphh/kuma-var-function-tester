<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 560px; padding: 12px; font-family: Consolas, monospace; font-size: 13px; }
    h3 { margin: 0 0 8px 0; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 4px; font-family: Consolas, monospace; }
    button { margin-top: 8px; padding: 6px 16px; cursor: pointer; }
    #result { margin-top: 12px; padding: 8px; background: #f0f0f0; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-all; min-height: 20px; }
    .vars { display: flex; flex-direction: column; gap: 4px; }
    .var-row { display: grid; grid-template-columns: 1fr 1fr 32px; gap: 4px; align-items: center; }
    .var-row button {
      margin: 0;
      padding: 4px 8px;
      width: 32px;
      height: 28px;
      background: #f5c6c6;
      border: 1px solid #c99;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      color: #900;
      line-height: 1;
    }
    .var-row button:hover { background: #eea3a3; }
    .error { color: #c00; }
    .buttons-row { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <h3>KUMA Function Tester</h3>

  <label>Выражение:</label>
  <textarea id="expression" rows="3" placeholder="len(DeviceCustomString1)">len(DeviceCustomString1)</textarea>

  <label>Значения переменных (имя = значение):</label>
  <div class="vars" id="varsContainer"></div>

  <div class="buttons-row">
    <button id="addVar">Новая переменная</button>
    <button id="evaluate">Вычислить</button>
  </div>

  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
